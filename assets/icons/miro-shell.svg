<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Matte Dark Basalt Background -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A1C1E" />
      <stop offset="100%" stop-color="#0D0E10" />
    </radialGradient>

    <!-- Emerald / Sage Glow -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Base Plate (Squircle with Subtle Border) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg-grad)" filter="url(#shadow)" stroke="#2D3135" stroke-width="2"/>

  <!-- Geometric Hyprland Tiling Matrix (Low-contrast, refined) -->
  <g stroke="#262A2E" stroke-width="2" opacity="0.6">
    <!-- Master window area -->
    <rect x="96" y="96" width="180" height="320" rx="8" fill="none"/>
    <!-- Stacked windows area -->
    <rect x="292" y="96" width="124" height="150" rx="8" fill="none"/>
    <rect x="292" y="266" width="124" height="150" rx="8" fill="none"/>
  </g>

  <!-- Modern Abstract "M" / Shell Ribbon overlaying the tiles -->
  <!-- Left Leg -->
  <path d="M 120 376 V 156 L 206 270"
        fill="none"
        stroke="#E2E8F0"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Right Leg (Slight gap for modern geometric separation) -->
  <path d="M 306 270 L 392 156 V 376"
        fill="none"
        stroke="#E2E8F0"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Central Emerald "Quickshell" Core Accent -->
  <path d="M 206 270 L 256 336 L 306 270"
        fill="none"
        stroke="#10B981"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#emerald-glow)"/>

  <!-- Minimalist Status Indicator Dot -->
  <circle cx="256" cy="140" r="10" fill="#10B981" filter="url(#emerald-glow)"/>
</svg>
